<style id="pageCss">
.page{width:210mm;height:297mm;padding:5mm 5mm 5mm 15mm;box-sizing:border-box;background:#fff;color:#000;font-family:'BIZ UDPGothic',sans-serif;font-size:12pt;line-height:var(--lh,2);overflow:hidden;position:relative}
.page *{box-sizing:border-box}
.sheet{height:100%;overflow:hidden}
.page rt{font-size:6pt;font-weight:400}
.nm{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:var(--nm,7mm)}
.nm .no{font-size:12pt}
.nm .nr{display:flex;align-items:flex-end;gap:2mm}
.nm .line{display:inline-block;width:70mm;height:9mm;border-bottom:0.3mm solid #000}
.lead{margin:0 0 1mm}
.cap{font-weight:700;margin-top:1.5mm;margin-bottom:0.5mm}
.tw{display:flex;gap:7mm;align-items:flex-start}
.tw .tc{flex:1;min-width:0}
table.tb{border-collapse:collapse;width:100%;table-layout:fixed;line-height:1.55}
.tb th,.tb td{border:0.3mm solid #000;padding:var(--cp,1.3mm) 1mm;text-align:center;font-weight:400;vertical-align:middle}
.tb th{background:#e4e4e4}
.tb th.rh{background:#fff;text-align:left;padding-left:2.5mm}
.note{border:0.3mm solid #000;padding:0.5mm 3mm 1mm;margin-top:2.5mm}
.note .nt{font-weight:700}
.note .ni{padding-left:1em;text-indent:-1em}
.q{margin-top:2mm;padding-bottom:var(--gap,10mm)}
.qt{padding-left:3em;text-indent:-3em}
.bl{white-space:nowrap}
.opts{display:flex;flex-wrap:wrap;gap:0.8mm 9mm;padding-left:3em;margin-top:0.5mm}
.opts.col{flex-direction:column}
.ansp h2{font-size:14pt;margin:2mm 0 3mm}
.ansp .al{margin-top:4mm;padding-left:3em;text-indent:-3em}
.ansp .al b{font-weight:700}
.ansp .why{display:block;text-indent:0}
@media print{
  @page{size:A4;margin:5mm 5mm 5mm 15mm}
  html,body{margin:0;padding:0;background:#fff}
  .page{width:auto;height:286mm;padding:0;margin:0;box-shadow:none;break-after:page;page-break-after:always}
  .page:last-child{break-after:auto;page-break-after:auto}
  .noprint{display:none!important}
}

<style>
html,body{height:100%;margin:0}
body{font-family:'BIZ UDPGothic',sans-serif;background:#eef4f7;color:#223;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;display:flex;flex-direction:column}
rt{font-size:.5em}
header{background:#fff;border-bottom:2px solid #9cc7d8;padding:4px 10px 5px;flex:none}
.top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
h1{font-size:17px;margin:0 auto 0 0;line-height:1.7}
button{font-family:inherit;font-size:14px;min-height:36px;min-width:36px;padding:0 11px;border-radius:7px;border:2px solid #4a90a8;background:#fff;color:#1d4f60;line-height:1.7;cursor:pointer;touch-action:manipulation}
button.main{background:#2f7f99;color:#fff;border-color:#2f7f99}
button.on{background:#d5edf5;border-color:#2f7f99;font-weight:700}
#panel{margin-top:4px;display:grid;gap:3px}
#panel.hide{display:none}
.row{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.row>.lb{font-weight:700;font-size:13px;line-height:1.7;margin-right:1px}
.row>.lb:not(:first-child){margin-left:8px}
.stp{display:flex;align-items:center;gap:3px}
.stp input{width:46px;height:36px;box-sizing:border-box;font-size:17px;text-align:center;border:2px solid #4a90a8;border-radius:7px;font-family:inherit;padding:0;-webkit-user-select:text;user-select:text}
.sub{font-size:12px;color:#456;line-height:1.7}
#msg{font-size:13px;color:#1d4f60;line-height:1.7;font-weight:700}
#msg:empty{display:none}
#pv{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px 8px 40px}
#scaler{transform-origin:0 0}
#pages .page{margin:0 0 6mm;box-shadow:0 1px 6px rgba(0,0,0,.25)}
#pages [contenteditable]{-webkit-user-select:text;user-select:text;outline:none}
#pages [contenteditable]:focus{background:#fff6c9}
.warn{position:absolute;left:15mm;right:5mm;bottom:2mm;background:#fff;border:0.6mm solid #b35b00;color:#7a3e00;padding:1mm 2mm;font-size:11pt;line-height:1.9}
#help{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(30,50,60,.45);z-index:10;display:flex;align-items:center;justify-content:center;padding:10px}
#help[hidden]{display:none}
.hbox{background:#fff;border:2px solid #4a90a8;border-radius:10px;max-width:760px;width:100%;max-height:100%;display:flex;flex-direction:column}

#helpBody{overflow:auto;-webkit-overflow-scrolling:touch;padding:4px 14px 14px;font-size:14px;line-height:1.9;-webkit-user-select:text;user-select:text}
#helpBody h3{font-size:15px;margin:12px 0 3px;color:#1d4f60;border-left:5px solid #4a90a8;padding-left:7px}
#helpBody table{border-collapse:collapse;width:100%}
#helpBody th,#helpBody td{border:1px solid #9cc7d8;padding:2px 7px;text-align:left;vertical-align:top}
#helpBody th{background:#e6f2f7;white-space:nowrap;font-weight:700}
#helpBody p{margin:3px 0}
@media print{
  #help{display:none!important}
  html,body{height:auto!important;overflow:visible!important;background:#fff}
  body{display:block}
  header{display:none!important}
  #pv{overflow:visible;padding:0;flex:none}
  #pvh{height:auto!important}
  #scaler{transform:none!important;width:auto!important;margin:0!important}
  #pages .page{margin:0;box-shadow:none;width:auto;height:286mm;padding:0}
  #pages [contenteditable]:focus{background:none}
}

<body>
<header>
  <div class="top">
    <h1 data-r="お{金|かね}の{計算|けいさん} プリント"></h1>
    <button id="bSet" data-r="{設定|せってい}"></button>
    <button id="bHelp" data-r="{説明|せつめい}"></button>
    <button id="bNew" class="main" data-r="{新|あたら}しい{問題|もんだい}"></button>
    <button id="bPrint" class="main" data-r="{印刷|いんさつ}する"></button>
    <button id="bCopy" data-r="HTMLをコピー"></button>
  </div>
  <div id="panel">
    <div class="row"><span class="lb">ジャンル</span><span id="gGenre" class="row"></span></div>
    <div class="row">
      <span class="lb">レベル</span><span class="stp" id="sLevel"></span>
      <span class="lb" data-r="まい{数|すう}"></span><span class="stp" id="sCount"></span>
      <span class="lb" data-r="{答|こた}え"></span><span id="gAns" class="row"></span>
    </div>
    <div class="sub" data-r="レベル 1：やさしい　2：ふつう　3：むずかしい　／　プリントの{文字|もじ}や{数字|すうじ}はタップして{直|なお}せます（{答|こた}えは{変|か}わりません）"></div>
  </div>
  <div id="msg"></div>
</header>
<div id="help" class="noprint" hidden><div class="hbox"><div class="hbar"><span class="ht" data-r="このアプリの{説明|せつめい}"></span><button id="bHelpClose" data-r="{閉|と}じる"></button></div><div id="helpBody"></div></div></div>
<div id="pv"><div id="pvh"><div id="scaler"><div id="pages"></div></div></div></div>

<script>
/*GEN-START*/
// ===== 問題を作る部分（画面や印刷とは分けてあるので、ほかのアプリにそのまま写せる） =====
var rnd=Math.random;
function ri(a,b){return a+Math.floor(rnd()*(b-a+1));}
function pick(a){return a[ri(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=ri(0,i);var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function bl(pre,post,n){return pre+'（'+'　'.repeat(Math.round((n||4)*1.75))+'）'+post;}
function pr(lo,hi,L){var s=L===1?50:10;return ri(Math.ceil(lo/s),Math.floor(hi/s))*s;}
function distinct(a){var o={};return a.every(function(v){if(o[v])return false;o[v]=1;return true;});}
var EN='{円|えん}';
var SEL='1つ{選|えら}び、（　）に○を{書|か}いてください。';
var TAIL='を{見|み}て、（1）〜（4）の{問題|もんだい}に{答|こた}えてください。';
var OSH='【お{知|し}らせ】';
var ZEN='{全部|ぜんぶ}でいくらですか。';
var OTS='を{出|だ}しました。おつりは、いくらですか。';
var DOCHI='どちらが、いくら{安|やす}いですか。';
var COIN='を、おつりが{出|で}ないように、ちょうどはらいます。お{金|かね}の{正|ただ}しい{組|く}み{合|あ}わせを';
var NAMES=['ゆうた','みさき','けんじ','さくら','はると','あおい','そうた','ひなた'];

// ---- 小問を作る部品 ----
// 金額を書く問題
function wq(o,t,val,w){o.qs.push({t:t,a:bl('',EN)});o.ans.push({a:val+EN,w:w||''});return true;}
// 数を書く問題
function cq(o,t,val,unit,w){o.qs.push({t:t,a:bl('',unit,3)});o.ans.push({a:val+unit,w:w||''});return true;}
// 3つから選ぶ問題（正しいもの1つと、まちがい2つ）
function selQ(o,t,correct,wrongs,w){
  var seen={},ws=[];seen[correct]=1;
  wrongs.forEach(function(x){if(x&&!seen[x]){seen[x]=1;ws.push(x);}});
  if(ws.length<2)return false;
  var list=shuffle([{s:correct,ok:1},{s:ws[0]},{s:ws[1]}]),pos=0;list.forEach(function(x,k){if(x.ok)pos=k;});
  o.qs.push({t:t+SEL,opts:list.map(function(x){return x.s;}),col:true});
  o.ans.push({a:'{上|うえ}から'+(pos+1)+'{番目|ばんめ}',w:w||''});return true;
}
// どちらがいくら安いか（まちがいは「割引などを忘れた結果」と「反対」）
function cheapQ(o,t,nA,nB,tA,tB,fA,fB,w){
  if(tA===tB)return false;
  function st(a,b){return a<b?nA+'{方|ほう}が'+(b-a)+EN+'{安|やす}い':nB+'{方|ほう}が'+(a-b)+EN+'{安|やす}い';}
  var ws=[];if(fA!==fB)ws.push(st(fA,fB));
  ws.push(st(tB,tA));ws.push(st(tA<tB?tA-100:tA+100,tB));
  return selQ(o,t,st(tA,tB),ws,w);
}
// お金の組み合わせ
function coins(n){
  var ds=[[1000,'1000{円|えん}さつ'],[500,'500{円玉|えんだま}'],[100,'100{円玉|えんだま}'],[50,'50{円玉|えんだま}'],[10,'10{円玉|えんだま}']],out=[];
  ds.forEach(function(d){var c=Math.floor(n/d[0]);n-=c*d[0];if(c)out.push(d[1]+c+'まい');});return out.join('、');
}
function coinQ(o,t,total,forgot,w){
  var c=[forgot,total+100,total-50,total+50].filter(function(v){return v>0&&v!==total;}).map(coins);
  return selQ(o,t+COIN,coins(total),c,w);
}
function P1(x){return x[1];}
function yenRows(a){return a.map(function(x){return [x[0],x[1]+EN];});}

// ---- ジャンル1：ラーメン屋 ----
function genRamen(L){
  var men=[['しょうゆラーメン',pr(600,750,L)],['しおラーメン',pr(600,750,L)],['みそラーメン',pr(700,850,L)],['とんこつラーメン',pr(700,850,L)],['チャーシューメン',pr(900,1050,L)]];
  var gz=L===3?ri(13,18)*20:pr(250,350,L);
  var so=[['チャーハン',pr(400,550,L)],['からあげ',pr(300,450,L)],['ライス',pr(100,200,L)],['ゆでたまご',pr(80,150,L)]];
  var side=[['ぎょうざ',gz]].concat(so);
  if(!distinct(men.map(P1)))return null;
  var OM=L===1?100:pick([100,150]),SD=L===2?pick([50,100]):0,RD=50,gzs=L===2?gz-SD:L===3?gz/2:gz;
  var nm=shuffle(NAMES),o={qs:[],ans:[]},m=shuffle(men),s=shuffle(so),a,b,c,t,ok;
  var CH='{注文|ちゅうもん}',DAI='{代金|だいきん}は、',OMR='{大|おお}もりの',D10='10日に、';
  var notes=['ラーメンを{大|おお}もりにすると、'+OM+EN+'{高|たか}くなります。'];
  if(L===2)notes.push('ラーメン1つとぎょうざ1つをいっしょに'+CH+'すると、ぎょうざが'+SD+EN+'{引|び}きになります。');
  if(L===3){notes.push('ラーメン1つとぎょうざ1つをいっしょに'+CH+'すると、ぎょうざが{半額|はんがく}になります。');
    notes.push('{毎月|まいつき}10日は「ラーメンの{日|ひ}」です。ラーメンがどれも'+RD+EN+'{引|び}きになります。');}
  var gzw=L===2?'ぎょうざは'+gz+'−'+SD+'＝'+gzs+EN:'ぎょうざは{半額|はんがく}で'+gzs+EN;
  // (1) 合計
  if(L===1)wq(o,nm[0]+'さんは、'+m[0][0]+'を1つと、'+s[0][0]+'を1つ'+CH+'しました。'+DAI+ZEN,m[0][1]+s[0][1],m[0][1]+'＋'+s[0][1]);
  else wq(o,nm[0]+'さんは、'+m[0][0]+'を1つと、'+s[0][0]+'を1つと、'+s[1][0]+'を1つ'+CH+'しました。'+DAI+ZEN,m[0][1]+s[0][1]+s[1][1],m[0][1]+'＋'+s[0][1]+'＋'+s[1][1]);
  // (2) おつり・ちがい
  if(L===1){a=m[1][1]<1000?m[1]:m[2];wq(o,nm[1]+'さんは、'+a[0]+'を1つ'+CH+'して、1000'+EN+OTS,1000-a[1],'1000−'+a[1]);}
  else if(rnd()<0.5){a=m[1];b=s[2];t=a[1]+b[1];wq(o,nm[1]+'さんは、'+a[0]+'を1つと、'+b[0]+'を1つ'+CH+'して、2000'+EN+OTS,2000-t,a[1]+'＋'+b[1]+'＝'+t+'、2000−'+t);}
  else{var srt=men.slice().sort(function(x,y){return y[1]-x[1];}),hi=srt[0],lo=srt[4];
    wq(o,'いちばん{高|たか}いラーメンと、いちばん{安|やす}いラーメンでは、ねだんはいくらちがいますか。',hi[1]-lo[1],hi[0]+hi[1]+EN+'−'+lo[0]+lo[1]+EN);}
  // (3) 条件つき
  a=m[2];
  if(L===1){b=s[1];wq(o,nm[2]+'さんは、'+OMR+a[0]+'を1つと、'+b[0]+'を1つ'+CH+'しました。'+DAI+ZEN,a[1]+OM+b[1],a[1]+'＋'+OM+'＋'+b[1]+'（{大|おお}もりは'+OM+EN+'{高|たか}くなります）');}
  else if(L===2){b=s[3];wq(o,nm[2]+'さんは、'+a[0]+'を1つと、ぎょうざを1つと、'+b[0]+'を1つ'+CH+'しました。'+DAI+ZEN,a[1]+gzs+b[1],a[1]+'＋'+gzs+'＋'+b[1]+'（'+gzw+'）');}
  else{t=a[1]-RD+OM;wq(o,nm[2]+'さんは、'+D10+OMR+a[0]+'を1つと、ぎょうざを1つ'+CH+'しました。'+DAI+ZEN,t+gzs,'ラーメンは'+a[1]+'−'+RD+'＋'+OM+'＝'+t+EN+'、'+gzw+'。'+t+'＋'+gzs);}
  // (4)
  var A=nm[3]+'さん',B=nm[4]+'さん',kind=pick(L===3?['cheap','remain']:['cheap','guess','coin']);
  a=m[3];b=m[4];c=s[2];
  if(kind==='cheap'){
    if(L===1){var tA=a[1]+OM,tB=b[1]+c[1];
      ok=cheapQ(o,A+'は'+OMR+a[0]+'を1つ、'+B+'は'+b[0]+'を1つと'+c[0]+'を1つ'+CH+'しました。{代金|だいきん}は、'+DOCHI,A+'の',B+'の',tA,tB,a[1],tB,
        A+'：'+a[1]+'＋'+OM+'＝'+tA+EN+'、'+B+'：'+b[1]+'＋'+c[1]+'＝'+tB+EN);}
    else if(L===2){tA=a[1]+gzs;tB=b[1]+OM+c[1];
      ok=cheapQ(o,A+'は'+a[0]+'を1つとぎょうざを1つ、'+B+'は'+OMR+b[0]+'を1つと'+c[0]+'を1つ'+CH+'しました。{代金|だいきん}は、'+DOCHI,A+'の',B+'の',tA,tB,a[1]+gz,b[1]+c[1],
        A+'：'+a[1]+'＋'+gzs+'＝'+tA+EN+'、'+B+'：'+b[1]+'＋'+OM+'＋'+c[1]+'＝'+tB+EN);}
    else{tA=a[1]-RD+OM+gzs;tB=b[1]-RD+c[1];
      ok=cheapQ(o,D10+A+'は'+OMR+a[0]+'を1つとぎょうざを1つ、'+B+'は'+b[0]+'を1つと'+c[0]+'を1つ'+CH+'しました。{代金|だいきん}は、'+DOCHI,A+'の',B+'の',tA,tB,a[1]+OM+gz,b[1]+c[1],
        A+'：'+a[1]+'−'+RD+'＋'+OM+'＋'+gzs+'＝'+tA+EN+'、'+B+'：'+b[1]+'−'+RD+'＋'+c[1]+'＝'+tB+EN);}
  }else if(kind==='guess'){
    var cnt={},list=[];
    men.forEach(function(x){side.forEach(function(y){var v=x[1]+(y[0]==='ぎょうざ'?gzs:y[1]);cnt[v]=(cnt[v]||0)+1;list.push([x,y,v]);});});
    var g=shuffle(list.filter(function(z){return cnt[z[2]]===1;}))[0];if(!g)return null;
    var pay=g[2]<1000?1000:2000;
    o.qs.push({t:A+'は、ラーメン（{大|おお}もりではない）を1つと、サイドメニューを1つ'+CH+'して、'+pay+EN+'を{出|だ}しました。おつりは'+(pay-g[2])+EN+'でした。'+A+'が'+CH+'したものを{書|か}いてください。',
      a:bl('ラーメン','　',5)+bl('サイドメニュー','',5)});
    o.ans.push({a:g[0][0]+'と'+g[1][0],w:pay+'−'+(pay-g[2])+'＝'+g[2]+EN+'。'+g[0][1]+'＋'+(g[2]-g[0][1])+'＝'+g[2]+(g[1][0]==='ぎょうざ'&&L===2?'（'+gzw+'）':'')});ok=true;
  }else if(kind==='coin'){
    if(L===1){t=a[1]+OM+c[1];ok=coinQ(o,A+'は、'+OMR+a[0]+'を1つと、'+c[0]+'を1つ'+CH+'しました。この{代金|だいきん}',t,a[1]+c[1],a[1]+'＋'+OM+'＋'+c[1]+'＝'+t+EN);}
    else{t=a[1]+gzs+c[1];ok=coinQ(o,A+'は、'+a[0]+'を1つと、ぎょうざを1つと、'+c[0]+'を1つ'+CH+'しました。この{代金|だいきん}',t,a[1]+gz+c[1],a[1]+'＋'+gzs+'＋'+c[1]+'＝'+t+EN+'（'+gzw+'）');}
  }else{
    t=2*(a[1]-RD)+gzs;
    ok=wq(o,A+'は、3000'+EN+'を{持|も}って、'+D10+'{店|みせ}に{行|い}きました。'+a[0]+'を2つと、ぎょうざを1つ'+CH+'すると、{残|のこ}りのお{金|かね}は、いくらですか。',3000-t,
      'ラーメンは（'+a[1]+'−'+RD+'）×2＝'+2*(a[1]-RD)+EN+'、'+gzw+'。3000−'+t);
  }
  if(!ok)return null;
  return {genre:'ラーメン{屋|や}',lead:nm[0]+'さんたちは、ラーメン{屋|や}に{行|い}きました。{次|つぎ}の【メニュー】と'+OSH+TAIL,
    tcap:'【メニュー】',tables:[{lbw:62,head:['ラーメン','ねだん'],rows:yenRows(men)},{lbw:62,head:['サイドメニュー','ねだん'],rows:yenRows(side)}],notes:notes,qs:o.qs,ans:o.ans};
}

// ---- ジャンル2：カフェ（持ち帰り） ----
function genCafe(L){
  var dr=[['コーヒー',pr(300,400,L)],['こうちゃ',pr(300,400,L)],['カフェオレ',pr(350,450,L)],['ココア',pr(350,450,L)],['オレンジジュース',pr(250,350,L)]];
  var fd=[['サンドイッチ',pr(400,550,L)],['ホットドッグ',pr(350,450,L)],['チーズケーキ',pr(400,500,L)]],sm=[['ドーナツ',pr(150,250,L)],['クッキー',pr(100,200,L)]];
  var D=L===1?50:pick([20,30]),LS=L===3?pick([50,80]):0;

var GENRES=[
  {id:'ramen',name:'ラーメン{屋|や}',gen:genRamen},

  {id:'clean',name:'クリーニング',gen:genClean},

// ジャンルid・レベル(1〜3)から問題を1つ作る
function makeProblem(id,L){
  var g=GENRES.filter(function(x){return x.id===id;})[0];

  return null;

function build(){

    h+=pageHTML(p,i+1,many);if(S.ans)h+=ansHTML(p,i+1,many);

// 1まいに収める：計算を書くための空き（--gap）を広くとり、入りきらないときは少しずつ縮める
function fitPage(pg){
  var sh=pg.querySelector('.sheet'),gap=22,lh=2,cp=1.3,nm=7,n=0;
  function set(){pg.style.setProperty('--gap',gap+'mm');pg.style.setProperty('--lh',lh.toFixed(2));pg.style.setProperty('--cp',cp.toFixed(1)+'mm');pg.style.setProperty('--nm',nm+'mm');}
  function over(){return sh.firstElementChild.offsetHeight>sh.clientHeight-4;}
  set();
  while(over()&&n++<200){if(gap>5)gap-=1;else if(cp>0.7)cp-=0.1;else if(nm>3)nm-=1;else if(gap>1)gap-=0.5;else if(lh>1.65)lh-=0.05;else if(gap>0)gap-=0.5;else break;set();}
  var w=pg.querySelector('.warn');if(w)w.remove();
  if(over()){w=document.createElement('div');w.className='warn noprint';w.innerHTML=R('1まいに{入|はい}りきっていないよ。{文|ぶん}を{短|みじか}くするか、{新|あたら}しい{問題|もんだい}を{作|つく}ってみてね。');pg.appendChild(w);}
}

function stepper(el,key,min,max){
  el.innerHTML='<button aria-label="へらす">▽</button><input type="number" inputmode="numeric" min="'+min+'" max="'+max+'"><button aria-label="ふやす">△</button>';
  var inp=el.querySelector('input'),bs=el.querySelectorAll('button');inp.value=S[key];

}
